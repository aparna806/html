<!DOCTYPE html>
<html>
<head>
<title>Registration Form</title>
<style>
body{
   font-family:Arial;
}
.form {
  width:600px;
  margin:30px auto;
  padding:25px;
  background-color:lightpink;
}

label {
  display:inline-block;
  width:180px; margin:8px;
}

input,select,textarea {
margin:5px;
}
textarea {
width:200px; height:70px;
}
</style>
</head>
<body>
<div class="form">
<h2 align="center">Registration Form</h2>
<form>
<label>Full name</label>
<input type="text"required><br>
<label>Mobile number</label>
<input type="tel"maxlength="10"required><br>
<label>Email id</label>
<input type="email"required><br>
<label>Age</label>
<input type="number"><br>
<label>Gender</label>
<input type="radio" name="g">Male
<input type="radio" name="g">Female
<input type="radio" name="g">Others<br>
<label>Date of birth</label>
<input type="date"><br>
<label>Address</label>
<textarea></textarea><br>
<label>Current study</label>
<select>
   <option>BCA</option>
   <option>MCA</option>
   <option>B.Tech</option>
</select><br>
<label>Department</label>
<select>
<option>CS</option>
<option>IT</option>
<option>Commerce</option>
<select><br>
<label>Upload CV</label>
<input type="file"><br>
<label>Programming languages</label>
<input type="checkbox">HTML
<input type="checkbox">CSS
<input type="checkbox">React
<input type="checkbox">Flutter<br>
<label>Languages</label>
<input type="checkbox">English
<input type="checkbox">Malayalam
<input type="checkbox">Arabic
<input type="checkbox">Hindi<br>
<input type="submit" value="Submit">
<input type="reset" value="Reset">
</form>
</div>
</body>
</html>
